<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REC">
  <title>REC</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <script>
    // tema escolhido (guardado no aparelho), aplicado antes de pintar a tela
    try { var t = localStorage.getItem('rec.theme'); if (t && t !== 'preto') document.documentElement.dataset.theme = t; } catch (e) {}
    (function () { var c = { grafite: '#16171a', verde: '#07110e', marinho: '#070d1a' }[document.documentElement.dataset.theme]; if (c) document.querySelector('meta[name=theme-color]').setAttribute('content', c); })();
  </script>
</head>
<body>
  <main id="screen" aria-live="polite"></main>

  <nav class="tabs" aria-label="Abas">
    <a class="tab" href="#hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/></svg>Hoje</a>
    <a class="tab" href="#treino">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h4l3-10 3 10h6"/></svg>Treino</a>
    <a class="tab" href="#prova">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>Prova</a>
    <a class="tab" href="#tendencias">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Corpo</a>
  </nav>

  <script type="module" src="/app.js"></script>
</body>
</html>
